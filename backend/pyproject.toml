[project]
name = "domino-backend"
version = "1.0.0"
description = "DOMINO — Family Resilience Intelligence System (FastAPI + OR-Tools CP-SAT)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "ortools>=9.10",
  "google-genai>=1.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["benchmark: runs the full executable benchmark suite (slow)"]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E701", "E702", "B008", "B905", "B007", "E741"]
