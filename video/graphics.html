<script>
const clip = new URLSearchParams(location.search).get('clip') || '24'

// deterministic constellation

const edges = []

  const d = nodes.map((n, j) => [j, Math.hypot(n.x - nodes[i].x, n.y - nodes[i].y)]).filter(([j]) => j !== i).sort((a, b) => a[1] - b[1]).slice(0, 3)

const adj = nodes.map(() => []); edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a) })
const hop = nodes.map(() => Infinity); hop[0] = 0; const q = [0]
while (q.length) { const u = q.shift(); for (const v of adj[u]) if (hop[v] === Infinity) { hop[v] = hop[u] + 1; q.push(v) } }
const maxHop = Math.max(...hop.filter(Number.isFinite))
nodes.forEach((n, i) => { if (!Number.isFinite(hop[i])) hop[i] = maxHop + 1 })
const ez = (t) => (t < 0 ? 0 : t > 1 ? 1 : t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2)
const names = [['May Ahmed Mourad', 'Grade 12'], ['Shamsa Faris Almazrouei', 'Grade 12'], ['Fatima Mohamed Almazrouei', 'Grade 11']]

const L = {}
if (clip === '22') {

  }

  if (clip === '23') { show(L.a, t, 1.3, 0.6); show(L.b, t, 2.3, 0.6) }
  if (clip === '24') { show(L.w, t, 0.2); show(L.s, t, 0.6); show(L.q, t, 0.9, 0.6, 18); show(L.u, t, 1.5); show(L.c, t, 1.9); show(L.f, t, 2.3, 0.5, 8)
    document.getElementById('black').style.opacity = ez((t - 4.5) / 0.5) }

}
requestAnimationFrame(frame)

// ---------- clips 5, 11, 20: conceptual graphics (no AI imagery) ----------
if (['05', '11', '20'].includes(clip)) {
  const MIN0 = 870, MIN1 = 1080, X0 = 260, X1 = 1660
  const X = (m) => X0 + (m - MIN0) / (MIN1 - MIN0) * (X1 - X0)
  const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath() }
  const txt = (s, x, y, size, color, weight = 700, align = 'left', mono = false) => { g.font = `${weight} ${size}px ${mono ? '"IBM Plex Mono",Consolas,monospace' : 'Manrope,Calibri,sans-serif'}`; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y) }
  const tasks = [['School pickup', 885, 925], ['Grocery collection', 955, 990], ['Homework assistance', 1005, 1035], ['Dinner preparation', 1050, 1080]]
  const axis = () => { g.strokeStyle = 'rgba(130,178,214,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(X0 - 40, 720); g.lineTo(X1 + 40, 720); g.stroke()
    for (let m = 870; m <= 1080; m += 30) { const x = X(m); g.beginPath(); g.moveTo(x, 712); g.lineTo(x, 728); g.stroke(); txt(`${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`, x, 762, 22, '#82B2D6', 600, 'center', true) } }
  const hatch = (x, y, w, h, col) => { g.save(); rr(x, y, w, h, 14); g.clip(); g.strokeStyle = col; g.lineWidth = 6; for (let k = -h; k < w + h; k += 22) { g.beginPath(); g.moveTo(x + k, y + h); g.lineTo(x + k + h, y); g.stroke() } g.restore() }
  const frame2 = (now) => {
    const t = T0 === null ? 0 : (now - T0) / 1000
    g.clearRect(0, 0, 1920, 1080); const bg = g.createRadialGradient(960, 540, 100, 960, 540, 1100); bg.addColorStop(0, '#173b69'); bg.addColorStop(1, '#0b2040'); g.fillStyle = bg; g.fillRect(0, 0, 1920, 1080)
    g.lineCap = 'butt'; g.lineJoin = 'miter'
    if (clip === '05') {
      axis()
      tasks.forEach(([n, a, b], i) => {
        const x = X(a), w = X(b) - X(a), y = 430, h = 220, p = ez((t - 0.15 * i) / 0.5)
        g.globalAlpha = p; g.fillStyle = '#255E99'; rr(x, y + (1 - p) * 20, w, h, 16); g.fill()
        if (i === 0) { const k = ez((t - 0.9) / 0.9); g.fillStyle = `rgba(180,65,74,${0.75 * k})`; rr(x, y, w, h, 16); g.fill(); g.save(); g.globalAlpha = k; hatch(x, y, w, h, 'rgba(255,255,255,.45)'); g.restore() }
        g.globalAlpha = p; txt(n, x + w / 2, y + h / 2 - 6, 24, '#fff', 700, 'center'); txt(`${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`, x + w / 2, y + h / 2 + 30, 22, '#EAF3FA', 600, 'center', true); g.globalAlpha = 1
      })
      for (let k = 0; k < 3; k++) { const p = ez((t - 2.5 - k * 0.25) / 1.0); if (p > 0 && p < 1) { const sx = X(905), tx = X(tasks[k + 1][1] + 15); g.globalAlpha = 1 - p; txt('?', sx + (tx - sx) * p, 400 - 80 * Math.sin(p * 3.14), 54, '#82B2D6', 800, 'center'); g.globalAlpha = 1 } }
      const a1 = ez((t - 1.0) / 0.5) * (t < 3.0 ? 1 : 1 - ez((t - 3.0) / 0.4)), a2 = ez((t - 3.1) / 0.5)
      g.globalAlpha = a1; txt('One cancelled slot', 960, 250, 70, '#fff', 800, 'center'); g.globalAlpha = a2; txt('What depends on it?', 960, 250, 70, '#82B2D6', 800, 'center'); g.globalAlpha = 1
      txt('Illustrative planner', 60, 1030, 24, 'rgba(234,243,250,.8)', 600)
    }
    if (clip === '11') {
      const lanes = ['Amina', 'Khalid', 'Noura', 'Yusuf'], LY = (i) => 300 + i * 100
      lanes.forEach((n, i) => { g.fillStyle = 'rgba(255,255,255,.05)'; rr(X0 - 30, LY(i) - 40, X1 - X0 + 60, 80, 12); g.fill(); txt(n, X0 - 60, LY(i) + 9, 26, '#EAF3FA', 700, 'right') })
      axis()
      hatch(X(870), LY(0) - 30, X(1080) - X(870), 60, 'rgba(180,65,74,.5)')
      let sd = 11; const rn = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647 }
      const cands = []; for (let i = 0; i < 56; i++) { const lane = 1 + Math.floor(rn() * 3), start = 885 + Math.floor(rn() * 170), len = 30 + Math.floor(rn() * 14); cands.push({ lane, start, len, show: 0.2 + (i / 56) * 1.4, ok: false }) }
      const real = [[1, 885, 40], [1, 955, 35], [2, 1005, 30], [1, 1050, 30]]; real.forEach(([lane, start, len], i) => { cands[i * 14 + 3] = { lane, start, len, show: 0.2 + (i * 14 + 3) / 56 * 1.4, ok: true } })
      const scanX = X0 + (X1 - X0) * ez((t - 1.9) / 1.5)
      cands.forEach((c) => {
        const p = ez((t - c.show) / 0.25); if (p <= 0) return
        const x = X(c.start), w = X(c.start + c.len) - X(c.start), y = LY(c.lane) - 26
        const passed = t > 1.9 && x + w < scanX + 1
        let a = 0.55 * p, col = '#255E99'
        if (passed && !c.ok) a = 0.55 * p * (1 - 0.82 * ez((t - 1.9 - (x - X0) / (X1 - X0) * 1.5) / 0.3))
        if (passed && c.ok) { a = 1; col = '#82B2D6' }
        g.globalAlpha = a; g.fillStyle = col; rr(x, y, w, 52, 10); g.fill()
        if (c.ok && passed) { g.shadowColor = '#82B2D6'; g.shadowBlur = 24; g.strokeStyle = '#fff'; g.lineWidth = 3; rr(x, y, w, 52, 10); g.stroke(); g.shadowBlur = 0 }
        g.globalAlpha = 1
      })
      if (t > 1.9 && t < 3.5) { g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3; g.beginPath(); g.moveTo(scanX, 230); g.lineTo(scanX, 700); g.stroke() }
      const cnt = Math.min(56, Math.round(56 * ez((t - 0.2) / 1.5)))
      txt(String(cnt), 330, 170, 90, '#fff', 800, 'left', true); txt('candidate arrangements', 330 + 130, 168, 36, '#82B2D6', 700)
      txt('Conceptual visualization', 60, 1030, 24, 'rgba(234,243,250,.8)', 600)
    }
    if (clip === '20') {
      const xs = [360, 760, 1160, 1560], names = ['Describe', 'Optimize', 'Verify', 'Decide'], subs = ['AI', 'Math', 'Independent check', 'You'], at = [0.3, 1.4, 2.6, 3.7]
      const line = ez((t - 0.1) / 3.6); g.strokeStyle = 'rgba(130,178,214,.45)'; g.lineWidth = 4; g.beginPath(); g.moveTo(xs[0], 470); g.lineTo(xs[0] + (xs[3] - xs[0]) * line, 470); g.stroke()
      xs.forEach((x, i) => {
        const on = ez((t - at[i]) / 0.35), sz = i === 3 ? 190 : 170
        g.save(); g.translate(x, 470); g.scale(1 + on * 0.06, 1 + on * 0.06)
        g.shadowColor = '#82B2D6'; g.shadowBlur = 40 * on; g.fillStyle = on > 0.02 ? `rgba(37,94,153,${0.55 + 0.45 * on})` : 'rgba(255,255,255,.07)'; rr(-sz / 2, -sz / 2, sz, sz, 28); g.fill(); g.shadowBlur = 0
        g.strokeStyle = on > 0.02 ? '#82B2D6' : 'rgba(130,178,214,.5)'; g.lineWidth = 3; rr(-sz / 2, -sz / 2, sz, sz, 28); g.stroke()
        g.strokeStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round'; g.fillStyle = '#fff'
        if (i === 0) { rr(-44, -40, 88, 62, 14); g.stroke(); g.beginPath(); g.moveTo(-14, 22); g.lineTo(-24, 42); g.lineTo(6, 22); g.stroke() }
        if (i === 1) { for (const [yy, kx] of [[-30, -18], [0, 22], [30, -4]]) { g.beginPath(); g.moveTo(-46, yy); g.lineTo(46, yy); g.stroke(); g.beginPath(); g.arc(kx, yy, 9, 0, 6.28); g.fill() } }
        if (i === 2) { g.beginPath(); g.moveTo(0, -48); g.lineTo(42, -30); g.lineTo(36, 18); g.quadraticCurveTo(24, 40, 0, 52); g.quadraticCurveTo(-24, 40, -36, 18); g.lineTo(-42, -30); g.closePath(); g.stroke(); g.beginPath(); g.moveTo(-16, 2); g.lineTo(-3, 16); g.lineTo(20, -14); g.stroke() }
        if (i === 3) { g.beginPath(); g.arc(0, -4, 36, 0, 6.28); g.stroke(); g.beginPath(); g.moveTo(-16, -2); g.lineTo(-4, 12); g.lineTo(18, -18); g.stroke(); if (t > 3.7) { g.strokeStyle = `rgba(130,178,214,${1 - ez((t - 3.7) / 1.2)})`; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 100 + 60 * ez((t - 3.7) / 1.2), 0, 6.28); g.stroke() } }
        g.restore()
        g.globalAlpha = 0.35 + 0.65 * on; txt(names[i], x, 640, 46, '#fff', 800, 'center'); txt(subs[i], x, 690, 28, '#82B2D6', 600, 'center', true); g.globalAlpha = 1
      })

}
