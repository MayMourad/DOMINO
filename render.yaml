# Render Blueprint for the DOMINO backend (New → Blueprint → pick this repository).
# Secrets are NOT stored here: GEMINI_API_KEY is entered in the Render dashboard.
services:
  - type: web
    name: domino-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://maymourad.github.io
      - key: SOLVER_TIME_LIMIT_SECONDS
        value: "2"
      - key: BENCHMARK_RUNS_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
